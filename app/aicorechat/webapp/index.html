<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>AI Core Chat</title>

    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.150.1/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "aicore.aicorechat": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>

<body
    id="content"
    class="sapUiBody sapUiSizeCompact"
>
    <div
        data-sap-ui-component
        data-name="aicore.aicorechat"
        data-id="container"
        data-settings='{"id": "aicore.aicorechat"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
